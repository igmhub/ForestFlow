[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name="forestflow"
dynamic = ["version"]
authors = [
    { name="Jonas Chaves-Montero", email="jchaves@ifae.es" },
    { name="Andreu Font-Ribera", email="afont@ifae.es" },
    { name="Laura Cabayol-Garcia"},
]
maintainers = [
    { name="Jonas Chaves-Montero", email="jchaves@ifae.es" }, 
    { name="Andreu Font-Ribera", email="afont@ifae.es" },
]
description = "Emulator for Lyman-alpha 3D power spectrum"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "Lyman-alpha", "Cosmology", "Power Spectrum", "Emulator",
]
requires-python = ">= 3.12"
# The Gaussian-process emulator (forest_mpg_gp) runs with these alone; the
# cINN emulator (forest_mpg_cinn) needs the ``cinn`` extra (torch, FrEIA).
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "threadpoolctl",
    "scikit-learn",
    "lace",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific :: Cosmology/Astrophysics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "numpydoc>=1.6",
    "pydata-sphinx-theme>=0.15",
]
test = [
    "pytest>=8",
    "torch",
    "freia",
]
cinn = ["torch", "freia"]
px = ["hankl"]
# forestflow.priors analysis (vega, for the BAO fits, is installed separately)
priors = ["astropy", "getdist"]
mpi = ["mpi4py"]
# corner is used by the notebooks/Figures_CM2025 reproductions
extended = ["torch", "freia", "hankl", "astropy", "getdist", "mpi4py", "corner"]


[tool.setuptools.packages.find]
include = ["forestflow", "forestflow.*"]
namespaces = false

[project.urls]
Homepage="https://github.com/igmhub/ForestFlow"
Documentation="https://igmhubforestflow.readthedocs.io/en/latest/"
Repository="https://github.com/igmhub/ForestFlow.git"
Issues="https://github.com/igmhub/ForestFlow/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pretrained_model: scientific regression tests using the bundled pretrained emulator",
]
